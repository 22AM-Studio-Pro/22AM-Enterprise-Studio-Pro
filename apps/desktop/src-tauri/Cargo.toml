[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.3", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.0.0", features = ["api-all"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.10"

[lib]
name = "tauri_plugin_desktop_engine"
path = "src/lib.rs"
